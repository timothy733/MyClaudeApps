        function _xor(str, key) {
            let out = "";
            for (let i = 0; i < str.length; i++) {
                out += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return out;
        }
        function _b64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64))); }

        function loadCatalog(encoded, key) {
            const scrambled = atob(encoded);
            const b64_1 = _xor(scrambled, key);
            const json = _b64ToUtf8(b64_1);
            const compact = JSON.parse(json);
            return compact.map(o => ({ isbn: o.i, title: o.t, supplier: o.s, price: o.p }));
        }

        const isbnDataList = loadCatalog(_D, _K);

        // Tracks every ISBN already scanned (or currently being processed),
        // so repeated detections of the same barcode never add another row —
        // even while a previous scan's cover-image lookup is still pending.
        const scannedISBNs = new Set();

        // Disable autofocus for iOS
        navigator.mediaDevices.getUserMedia({ video: { focusMode: "manual" } }).catch(() => {});

        // Barcode scanning logic
        codeReader.decodeFromVideoDevice(undefined, videoElement, (result, err) => {
            if (result) {
                let isbn = result.text;
                if (!isbn.startsWith("978")) return; // Only process ISBNs starting with "978"

                latestISBNField.value = isbn; // Show latest detected barcode
                if (!scannedISBNs.has(isbn)) {
                    scannedISBNs.add(isbn); // claim it immediately, before the async lookup below
                    addBooksToTable(isbn);
                }
            }
        });

        // Add books to the table
        async function addBooksToTable(isbn) {
            let matchingBooks = isbnDataList.filter(book => book.isbn === isbn);

            if (matchingBooks.length === 0) {
                alert(`ISBN ${isbn} not found.`);
                scannedISBNs.delete(isbn); // not actually added — allow a retry
                return;
            }

            let coverImage = await fetchBookCover(isbn);

            matchingBooks.forEach(({ title, supplier, price }) => {
                bookList.innerHTML += `
                    <tr data-isbn="${isbn}">
                        <td><img src="${coverImage}" alt="Cover"></td>
                        <td>${title}</td>
                        <td>${supplier}</td>
                        <td>${isbn}</td>
                        <td>${price}</td>
                    </tr>
                `;
            });
        }

        // Fetch book cover image from Google Books API
        async function fetchBookCover(isbn) {
            try {
                let response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
                let data = await response.json();
                return data.totalItems > 0 ? data.items[0].volumeInfo.imageLinks?.thumbnail || "" : "";
            } catch (error) {
                console.error("Error fetching book cover:", error);
                return "";
            }
        }

        // Clear all scanned rows
        clearBtn.addEventListener("click", () => {
            bookList.innerHTML = "";
            latestISBNField.value = "";
            scannedISBNs.clear();
        });
    </script>
